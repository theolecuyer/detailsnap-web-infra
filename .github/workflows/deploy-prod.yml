name: Deploy to Production (Blue/Green)

# Receives a repository_dispatch from the app repo when a final release tag is pushed
on:
    repository_dispatch:
        types: [prod-deploy]

env:
    AWS_REGION: us-east-1
    SERVICES: "auth-service core-service media-service frontend migrations"

permissions:
    contents: write

jobs:
    deploy:
        name: Promote ${{ github.event.client_payload.tag }} to Production
        runs-on: ubuntu-latest

        steps:
            - name: Checkout infra repo
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
              with:
                  token: ${{ secrets.GH_TOKEN }}

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Login to ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

            # Retag the UAT image (or latest) as prod-<tag> for traceability
            - name: Retag images for Production
              env:
                  REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                  RELEASE_TAG: ${{ github.event.client_payload.tag }}
              run: |
                  PROD_TAG="prod-${RELEASE_TAG}"
                  # Source from latest (which should be the UAT-validated build)
                  SOURCE_TAG="latest"
                  echo "Retagging ${SOURCE_TAG} images as ${PROD_TAG}"

                  for SERVICE in $SERVICES; do
                    MANIFEST=$(aws ecr batch-get-image \
                      --repository-name detailsnap/$SERVICE \
                      --image-ids imageTag=$SOURCE_TAG \
                      --query 'images[0].imageManifest' \
                      --output text 2>/dev/null || echo "")

                    if [ -z "$MANIFEST" ]; then
                      echo "WARNING: no ${SOURCE_TAG} image found for $SERVICE, skipping"
                      continue
                    fi

                    aws ecr put-image \
                      --repository-name detailsnap/$SERVICE \
                      --image-tag "$PROD_TAG" \
                      --image-manifest "$MANIFEST"

                    echo "Tagged $SERVICE → $PROD_TAG"
                  done

            # Update kustomization — ArgoCD will detect the change and start the blue/green rollout
            - name: Update Prod kustomization tags
              env:
                  RELEASE_TAG: ${{ github.event.client_payload.tag }}
              run: |
                  PROD_TAG="prod-${RELEASE_TAG}"
                  git config user.email "ci@detailsnap.io"
                  git config user.name "Detailsnap CI"

                  for SERVICE in $SERVICES; do
                    FILE="k8s/overlays/prod/${SERVICE}/kustomization.yaml"
                    if [ -f "$FILE" ]; then
                      sed -i "s/newTag: .*/newTag: ${PROD_TAG}/" "$FILE"
                      echo "Updated $FILE → $PROD_TAG"
                    fi
                  done

                  git add k8s/overlays/prod/
                  git diff --cached --quiet && echo "No changes to commit" && exit 0
                  git commit -m "chore: deploy ${RELEASE_TAG} to prod [skip ci]"
                  git push origin main

            - name: Summary
              run: |
                  echo "### Production Deploy Started" >> $GITHUB_STEP_SUMMARY
                  echo "Tag: \`${{ github.event.client_payload.tag }}\`" >> $GITHUB_STEP_SUMMARY
                  echo "ArgoCD will sync Prod and start the blue/green rollout." >> $GITHUB_STEP_SUMMARY
                  echo "Preview is live — promote with: \`kubectl argo rollouts promote <service> -n prod\`" >> $GITHUB_STEP_SUMMARY
                  echo "Rollback with: \`kubectl argo rollouts abort <service> -n prod\`" >> $GITHUB_STEP_SUMMARY
