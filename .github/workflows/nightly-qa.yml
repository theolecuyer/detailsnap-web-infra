name: Nightly QA Build

on:
    schedule:
        - cron: "0 8 * * *"
    workflow_dispatch:

env:
    AWS_REGION: us-east-1
    IMAGE_TAG: nightly-${{ github.run_id }}
    SOURCE_REPO: theolecuyer/detailsnap-web
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
    contents: write

jobs:
    build:
        name: Build ${{ matrix.service }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: true
            matrix:
                include:
                    - service: auth-service
                      context: auth-service
                    - service: core-service
                      context: core-service
                    - service: media-service
                      context: media-service
                    - service: frontend
                      context: frontend

        steps:
            - name: Checkout source
              uses: actions/checkout@v4
              with:
                  repository: ${{ env.SOURCE_REPO }}
                  token: ${{ secrets.GH_TOKEN }}

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Login to ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build and push
              env:
                  REGISTRY: ${{ steps.login-ecr.outputs.registry }}
              run: |
                  IMAGE=$REGISTRY/detailsnap/${{ matrix.service }}
                  docker build -t $IMAGE:$IMAGE_TAG ./${{ matrix.context }}
                  docker tag $IMAGE:$IMAGE_TAG $IMAGE:latest
                  docker push $IMAGE:$IMAGE_TAG
                  docker push $IMAGE:latest

    integration-test:
        name: Integration Test
        runs-on: ubuntu-latest
        needs: build

        steps:
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Login to ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Invoke integration test Lambda
              run: |
                  REGISTRY="${{ steps.login-ecr.outputs.registry }}"
                  ACCOUNT_ID=$(echo "$REGISTRY" | cut -d. -f1)
                  MEDIA_BUCKET="detailsnap-media-$ACCOUNT_ID"

                  PAYLOAD=$(jq -n \
                    --arg tag "$IMAGE_TAG" \
                    --arg registry "$REGISTRY" \
                    --arg bucket "$MEDIA_BUCKET" \
                    --arg token "${{ secrets.GH_TOKEN }}" \
                    '{image_tag: $tag, ecr_registry: $registry, media_bucket: $bucket, github_token: $token}')

                  aws lambda invoke \
                    --function-name detailsnap-integration-test \
                    --payload "$PAYLOAD" \
                    --cli-binary-format raw-in-base64-out \
                    --cli-read-timeout 0 \
                    response.json

                  cat response.json
                  SUCCESS=$(jq -r '.success' response.json)
                  MESSAGE=$(jq -r '.message' response.json)

                  if [ "$SUCCESS" != "true" ]; then
                    echo "Smoke test failed: $MESSAGE"
                    exit 1
                  fi

    deploy-qa:
        name: Deploy to QA
        runs-on: ubuntu-latest
        needs: integration-test
        if: success()

        steps:
            - name: Checkout infra repo
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GH_TOKEN }}

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Login to ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Retag images as qa-
              env:
                  REGISTRY: ${{ steps.login-ecr.outputs.registry }}
              run: |
                  QA_TAG="qa-$IMAGE_TAG"
                  for SERVICE in auth-service core-service media-service frontend; do
                    MANIFEST=$(aws ecr batch-get-image \
                      --repository-name detailsnap/$SERVICE \
                      --image-ids imageTag=$IMAGE_TAG \
                      --query 'images[0].imageManifest' \
                      --output text)
                    aws ecr put-image \
                      --repository-name detailsnap/$SERVICE \
                      --image-tag $QA_TAG \
                      --image-manifest "$MANIFEST"
                  done

            - name: Invoke deploy Lambda
              run: |
                  QA_TAG="qa-$IMAGE_TAG"
                  PAYLOAD=$(jq -n \
                    --arg tag "$QA_TAG" \
                    --arg token "${{ secrets.GH_TOKEN }}" \
                    '{image_tag: $tag, github_token: $token}')

                  aws lambda invoke \
                    --function-name detailsnap-deploy-qa \
                    --payload "$PAYLOAD" \
                    --cli-binary-format raw-in-base64-out \
                    response.json

                  cat response.json
                  SUCCESS=$(jq -r '.success' response.json)
                  if [ "$SUCCESS" != "true" ]; then
                    echo "Deploy Lambda failed"
                    exit 1
                  fi
                  echo "Deployed qa-$IMAGE_TAG to QA — ArgoCD will roll out shortly"

    notify-failure:
        name: Notify on Failure
        runs-on: ubuntu-latest
        needs: [build, integration-test, deploy-qa]
        if: failure()

        steps:
            - name: Send failure email
              run: |
                  curl -sX POST https://api.resend.com/emails \
                    -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
                    -H "Content-Type: application/json" \
                    -d '{
                      "from": "nightly@system.tlecuyer.codes",
                      "to": ["theoglecuyer@gmail.com"],
                      "subject": "Nightly QA Build Failed — ${{ env.IMAGE_TAG }}",
                      "html": "<p>The nightly QA build failed for run <strong>${{ github.run_id }}</strong>.</p><p><a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View run</a></p>"
                    }'
