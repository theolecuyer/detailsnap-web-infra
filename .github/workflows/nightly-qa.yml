name: Nightly QA Build

on:
    schedule:
        - cron: "0 8 * * *"
    workflow_dispatch:
    repository_dispatch:
        types: [qa-build]

env:
    AWS_REGION: us-east-1
    SOURCE_REPO: theolecuyer/detailsnap-web
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
    contents: write

jobs:
    get-sha:
        name: Get App SHA
        runs-on: ubuntu-latest
        outputs:
            app_sha: ${{ steps.sha.outputs.short }}
        steps:
            - name: Checkout source
              uses: actions/checkout@v4
              with:
                  repository: ${{ env.SOURCE_REPO }}
                  token: ${{ secrets.GH_TOKEN }}
            - name: Get short SHA
              id: sha
              run: echo "short=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

    build:
        name: Build ${{ matrix.service }}
        runs-on: ubuntu-latest
        needs: get-sha
        strategy:
            fail-fast: true
            matrix:
                include:
                    - service: auth-service
                      context: auth-service
                    - service: core-service
                      context: core-service
                    - service: media-service
                      context: media-service
                    - service: frontend
                      context: frontend
                    - service: migrations
                      context: db

        steps:
            - name: Checkout source
              uses: actions/checkout@v4
              with:
                  repository: ${{ env.SOURCE_REPO }}
                  token: ${{ secrets.GH_TOKEN }}

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Login to ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build and push
              env:
                  REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                  APP_SHA: ${{ needs.get-sha.outputs.app_sha }}
              run: |
                  IMAGE=$REGISTRY/detailsnap/${{ matrix.service }}
                  docker build -t $IMAGE:sha-$APP_SHA ./${{ matrix.context }}
                  docker tag $IMAGE:sha-$APP_SHA $IMAGE:latest
                  docker push $IMAGE:sha-$APP_SHA
                  docker push $IMAGE:latest

    integration-test:
        name: Integration Test
        runs-on: ubuntu-latest
        needs: [get-sha, build]

        steps:
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Login to ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Invoke integration test Lambda
              env:
                  APP_SHA: ${{ needs.get-sha.outputs.app_sha }}
              run: |
                  REGISTRY="${{ steps.login-ecr.outputs.registry }}"
                  ACCOUNT_ID=$(echo "$REGISTRY" | cut -d. -f1)
                  MEDIA_BUCKET="detailsnap-media-$ACCOUNT_ID"

                  PAYLOAD=$(jq -n \
                    --arg tag "sha-$APP_SHA" \
                    --arg registry "$REGISTRY" \
                    --arg bucket "$MEDIA_BUCKET" \
                    --arg token "${{ secrets.GH_TOKEN }}" \
                    '{image_tag: $tag, ecr_registry: $registry, media_bucket: $bucket, github_token: $token}')

                  aws lambda invoke \
                    --function-name detailsnap-integration-test \
                    --payload "$PAYLOAD" \
                    --cli-binary-format raw-in-base64-out \
                    --cli-read-timeout 0 \
                    response.json

                  cat response.json
                  SUCCESS=$(jq -r '.success' response.json)
                  MESSAGE=$(jq -r '.message' response.json)

                  if [ "$SUCCESS" != "true" ]; then
                    echo "Smoke test failed: $MESSAGE"
                    exit 1
                  fi

    refresh-image-updater-creds:
        name: Refresh Image Updater Credentials
        runs-on: ubuntu-latest
        needs: integration-test
        if: success()

        steps:
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Update Image Updater git credentials
              run: |
                  aws eks update-kubeconfig --name detailsnap --region $AWS_REGION
                  kubectl create secret generic image-updater-git-creds \
                    --namespace argocd \
                    --from-literal=username=theolecuyer \
                    --from-literal=password=${{ secrets.GH_TOKEN }} \
                    --dry-run=client -o yaml | kubectl apply -f -

    notify-failure:
        name: Notify on Failure
        runs-on: ubuntu-latest
        needs: [get-sha, build, integration-test]
        if: failure()

        steps:
            - name: Send failure email
              run: |
                  SHA="${{ needs.get-sha.outputs.app_sha }}"
                  LABEL="${SHA:-unknown}"
                  curl -sX POST https://api.resend.com/emails \
                    -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
                    -H "Content-Type: application/json" \
                    -d "{
                      \"from\": \"nightly@system.tlecuyer.codes\",
                      \"to\": [\"theoglecuyer@gmail.com\"],
                      \"subject\": \"Nightly QA Build Failed — sha-$LABEL\",
                      \"html\": \"<p>The nightly QA build failed for sha <strong>$LABEL</strong>.</p><p><a href=\\\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\\\">View run</a></p>\"
                    }"
