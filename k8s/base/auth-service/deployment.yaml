apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: detailsnap/auth-service
          ports:
            - containerPort: 8081
          envFrom:
            - secretRef:
                name: app-credentials
          env:
            - name: DB_NAME
              value: detailsnap
            - name: CORS_ORIGIN
              value: http://localhost:5173
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
