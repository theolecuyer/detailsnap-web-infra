apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: qa
resources:
  - ../../../base/auth-service
images:
  - name: detailsnap/auth-service
    newName: 651084712750.dkr.ecr.us-east-1.amazonaws.com/detailsnap/auth-service
    newTag: qa-nightly-25598782717
  - name: 651084712750.dkr.ecr.us-east-1.amazonaws.com/detailsnap/auth-service
    newTag: sha-8b3217d
patches:
  - patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          env: qa
      - op: replace
        path: /spec/template/spec/containers/0/env/0
        value:
          name: DB_NAME
          value: detailsnap_qa
      - op: replace
        path: /spec/template/spec/containers/0/env/1
        value:
          name: CORS_ORIGIN
          value: https://qa.tlecuyer.codes
    target:
      kind: Rollout
      name: auth-service
