apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: uat
resources:
  - ../../../base/frontend
  - canary-service.yaml
images:
  - name: detailsnap/frontend
    newName: 651084712750.dkr.ecr.us-east-1.amazonaws.com/detailsnap/frontend
    newTag: v1.0.1-rc.1
  - name: 651084712750.dkr.ecr.us-east-1.amazonaws.com/detailsnap/frontend
    newTag: v1.1.0-rc.4
patches:
  - patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          env: uat
      - op: replace
        path: /spec/replicas
        value: 4
      - op: replace
        path: /spec/strategy
        value:
          canary:
            canaryService: frontend-canary
            stableService: frontend
            trafficRouting:
              plugins:
                argoproj-labs/gatewayAPI:
                  httpRoute: main
                  namespace: uat
            steps:
              - setWeight: 25
              - pause: {duration: 2m}
              - setWeight: 50
              - pause: {duration: 2m}
              - setWeight: 75
              - pause: {duration: 2m}
              - setWeight: 100
              - pause: {duration: 2m}
    target:
      kind: Rollout
      name: frontend
