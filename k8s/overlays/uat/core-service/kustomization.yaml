apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: uat
resources:
  - ../../../base/core-service
  - canary-service.yaml
images:
  - name: detailsnap/core-service
    newName: 651084712750.dkr.ecr.us-east-1.amazonaws.com/detailsnap/core-service
    newTag: v1.0.1-rc.1
  - name: 651084712750.dkr.ecr.us-east-1.amazonaws.com/detailsnap/core-service
    newTag: v1.3.0-rc.1
patches:
  - patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          env: uat
      - op: replace
        path: /spec/template/spec/containers/0/env/0
        value:
          name: DB_NAME
          value: detailsnap_uat
      - op: replace
        path: /spec/template/spec/containers/0/env/1
        value:
          name: CORS_ORIGIN
          value: https://uat.tlecuyer.codes
      - op: replace
        path: /spec/replicas
        value: 4
      - op: replace
        path: /spec/strategy
        value:
          canary:
            canaryService: core-service-canary
            stableService: core-service
            trafficRouting:
              plugins:
                argoproj-labs/gatewayAPI:
                  httpRoute: main
                  namespace: uat
            steps:
              - setWeight: 25
              - pause: {duration: 2m}
              - setWeight: 50
              - pause: {duration: 2m}
              - setWeight: 75
              - pause: {duration: 2m}
              - setWeight: 100
              - pause: {duration: 2m}
    target:
      kind: Rollout
      name: core-service
