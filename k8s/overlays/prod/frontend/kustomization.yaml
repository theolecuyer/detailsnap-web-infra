apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - ../../../base/frontend

  - preview-service.yaml
images:
  - name: detailsnap/frontend
    newName: 651084712750.dkr.ecr.us-east-1.amazonaws.com/detailsnap/frontend
    newTag: prod-v1.0.0
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 4
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          env: prod

      - op: replace
        path: /spec/strategy
        value:
          blueGreen:
            activeService: frontend
            previewService: frontend-preview
            autoPromotionEnabled: false
            scaleDownDelaySeconds: 30
    target:
      kind: Rollout
      name: frontend
