apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecr-token-refresh
  namespace: argocd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecr-token-refresh
  namespace: argocd
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecr-token-refresh
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: ecr-token-refresh
    namespace: argocd
roleRef:
  kind: Role
  name: ecr-token-refresh
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ecr-token-refresh
  namespace: argocd
spec:
  schedule: "0 */6 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: ecr-token-refresh
          nodeSelector:
            node-type: system
          initContainers:
            - name: get-token
              image: amazon/aws-cli:latest
              command: ["/bin/bash", "-c"]
              args:
                - aws ecr get-login-password --region us-east-1 > /workspace/token
              volumeMounts:
                - name: workspace
                  mountPath: /workspace
          containers:
            - name: update-secret
              image: bitnami/kubectl:latest
              command: ["/bin/sh", "-c"]
              args:
                - |
                  TOKEN=$(cat /workspace/token)
                  kubectl create secret docker-registry ecr-pull-secret \
                    --namespace argocd \
                    --docker-server=651084712750.dkr.ecr.us-east-1.amazonaws.com \
                    --docker-username=AWS \
                    --docker-password="$TOKEN" \
                    --dry-run=client -o yaml | kubectl apply -f -
              volumeMounts:
                - name: workspace
                  mountPath: /workspace
          volumes:
            - name: workspace
              emptyDir: {}
          restartPolicy: OnFailure
